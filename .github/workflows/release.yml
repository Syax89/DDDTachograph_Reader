name: Build & Release

on:
  push:
    tags:
      - 'v*'

# Only the publishing job needs write access; every build job downloads sources
# and uploads artifacts, so read is enough.
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Tag must match core/version.py
      run: |
        APP_VERSION=$(python3 -c "from core.utils.version import __version__; print(__version__)")
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match core/utils/version.py ($APP_VERSION)"
          exit 1
        fi

  lint:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Ruff (correctness rules)
      run: |
        pip install -r requirements-dev.txt
        ruff check .
    - name: Mypy
      run: |
        pip install -r requirements-dev.txt
        mypy .

  test:
    runs-on: ubuntu-latest
    needs: [check-version, lint]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate synthetic mock data
      run: python tests/integration/generate_mock_ddd.py
    - name: Run test suite
      run: python -m pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Windows executable
      # build.spec is the single source of truth for the bundle
      # (hidden imports, datas, windowed mode, app version).
      run: pyinstaller build.spec

    - name: Generate mock data for smoke test
      run: python tests/integration/generate_mock_ddd.py

    - name: Smoke test bundle
      shell: pwsh
      timeout-minutes: 5
      env:
        TACHO_SMOKE_LOG: smoke.log
      # Windowed exe (console=False): no stdout — results go to TACHO_SMOKE_LOG,
      # exit code via WaitForExit with an explicit timeout (never hang CI).
      run: |
        $exe = "dist\TachoReader\TachoReader.exe"
        foreach ($cmd in @(,@('--version')) + @(,@('--smoke', 'tests\mock_data\mock_g2_card.ddd'))) {
          $p = Start-Process -FilePath $exe -ArgumentList $cmd -PassThru
          if (-not $p.WaitForExit(120000)) {
            Get-Process | Where-Object { $_.MainWindowTitle } |
              Format-Table Id, ProcessName, MainWindowTitle
            $p.Kill()
            Write-Error "Smoke test timed out: $cmd"
            if (Test-Path smoke.log) { Get-Content smoke.log }
            exit 1
          }
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed: $cmd (exit $($p.ExitCode))"
            if (Test-Path smoke.log) { Get-Content smoke.log }
            exit 1
          }
        }
        Get-Content smoke.log

    - name: Package as zip
      shell: pwsh
      run: |
        Compress-Archive -Path dist/TachoReader/* -DestinationPath TachoReader-${{ github.ref_name }}-windows-x64.zip

    - name: Upload Windows package
      # Nothing reaches the release here: publish-release owns publication, so a
      # failing sibling platform cannot leave a half-published release behind.
      uses: actions/upload-artifact@v7
      with:
        name: release-windows
        path: TachoReader-${{ github.ref_name }}-windows-x64.zip
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build macOS app
      run: pyinstaller build.spec

    - name: Generate mock data for smoke test
      run: python tests/integration/generate_mock_ddd.py

    - name: Smoke test bundle
      run: |
        ./dist/TachoReader.app/Contents/MacOS/TachoReader --version
        ./dist/TachoReader.app/Contents/MacOS/TachoReader --smoke tests/mock_data/mock_g2_card.ddd

    - name: Create DMG
      run: |
        hdiutil create -volname "TachoReader" -srcfolder dist/TachoReader.app -ov -format UDZO TachoReader-${{ github.ref_name }}-macos.dmg

    - name: Upload macOS package
      uses: actions/upload-artifact@v7
      with:
        name: release-macos
        path: TachoReader-${{ github.ref_name }}-macos.dmg
        if-no-files-found: error

  build-linux-flatpak:
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - name: Build, install and smoke-test Flatpak
      uses: ./.github/actions/build-flatpak
      with:
        bundle-name: TachoReader-${{ github.ref_name }}-linux-x86_64.flatpak

    - name: Upload Linux package
      uses: actions/upload-artifact@v7
      with:
        name: release-linux
        path: TachoReader-${{ github.ref_name }}-linux-x86_64.flatpak
        if-no-files-found: error

  publish-release:
    # The one and only publisher: it runs only after Windows, macOS and the
    # Linux Flatpak all built and smoke-tested their package successfully.
    name: Publish release
    needs: [build-windows, build-macos, build-linux-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Download all three platform packages
      uses: actions/download-artifact@v8
      with:
        pattern: release-*
        merge-multiple: true
        path: release-assets

    - name: Verify all three packages are present
      # Explicit filenames: an artifact that silently went missing must abort
      # the release instead of publishing a partial one.
      env:
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        for file in \
          "TachoReader-${TAG}-windows-x64.zip" \
          "TachoReader-${TAG}-macos.dmg" \
          "TachoReader-${TAG}-linux-x86_64.flatpak"; do
          test -s "release-assets/$file" || {
            echo "::error::missing or empty release package: $file"
            exit 1
          }
          echo "ok: $file ($(wc -c < "release-assets/$file") bytes)"
        done

    - name: Extract release notes from CHANGELOG
      # Extracted once here, not on every platform, so all platforms agree.
      # A version section may carry a short summary between the
      # '<!-- release-notes:start -->' and '<!-- release-notes:end -->' markers:
      # the release body is then that summary, and the detailed section stays in
      # the changelog for the record. Without the markers the whole section is
      # used, as before.
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v ver="$VERSION" '
          $0 ~ "^## \\[" ver "\\]" {flag=1; next}
          /^## \[/ {flag=0}
          flag' CHANGELOG.md > section.md
        if grep -q '<!-- release-notes:start -->' section.md; then
          awk '/<!-- release-notes:start -->/ {flag=1; next}
               /<!-- release-notes:end -->/   {flag=0}
               flag' section.md > release_notes.md
        else
          cp section.md release_notes.md
        fi
        test -s release_notes.md || echo "Release $GITHUB_REF_NAME" > release_notes.md

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/TachoReader-${{ github.ref_name }}-windows-x64.zip
          release-assets/TachoReader-${{ github.ref_name }}-macos.dmg
          release-assets/TachoReader-${{ github.ref_name }}-linux-x86_64.flatpak
        body_path: release_notes.md
        fail_on_unmatched_files: true
