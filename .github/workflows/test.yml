name: Tests

on:
  # Every branch push (version tags are owned by release.yml), every pull
  # request regardless of base branch, and manual runs.
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Ruff (correctness rules — see ruff.toml)
      run: |
        pip install -r requirements-dev.txt
        ruff check .
    - name: Mypy (see mypy.ini)
      run: |
        pip install -r requirements-dev.txt
        mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 dropped: EOL Oct 2025 and pytest 9 requires >= 3.10.
        python-version: ['3.10', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate synthetic mock data
      # Real DDD files are not versioned (personal data); tests that need
      # them skip on their own. Synthetic mocks exercise the decoders.
      run: python tests/integration/generate_mock_ddd.py

    - name: Check translation catalogs are compiled
      # A stale locale/<lang>/LC_MESSAGES/tacho.mo silently keeps the old
      # strings in the bundle, so the .mo files must match their .po sources.
      run: python scripts/compile_translations.py --check

    - name: Install the fonts the GUI fit sweep measures against
      # tests/unit/test_gui_summary_default.py measures every row of the summary
      # panel in DejaVu Sans — the widest default sans any supported platform
      # ships — and, on CI, *fails* rather than skipping when that family is
      # missing (a sweep that quietly measured a narrower font would report fits
      # no runner reproduces). The ubuntu-latest image ships it today; installing
      # it here makes that a dependency of this workflow instead of a property
      # of the image.
      #
      # Non-fatal by design: this step is a convenience, not the check. A font
      # that is genuinely missing still reds the leg — the sweep itself fails on
      # CI when it cannot measure the pinned family — so an apt mirror that is
      # down or slow must not fail the job for a reason unrelated to the code.
      if: matrix.python-version == '3.12'
      continue-on-error: true
      run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

    - name: Run test suite
      run: pytest -q

    - name: Real GUI render tests (Xvfb, Python 3.12 only)
      # The suite above runs headless, where every test that needs a real Tk
      # widget skips. This single leg re-runs those modules with a virtual
      # display so the row render, the tint tag, the hover tooltips, the
      # toolbar's labels and icons, the file overview a parse lands on (and the
      # all-catalog fit sweep of its rows), the progress bar's re-entrancy
      # guards, the pane layout, the hidden-infraction switch, the formatted cells, the integrity
      # badge and the batch-18 GUI cases are exercised in CI too. Every module
      # here is one this work stream added or changed and each of them skips
      # without a display, so leaving one out means it never runs at all.
      # xvfb-run ships with the ubuntu-latest image.
      if: matrix.python-version == '3.12'
      run: >
        xvfb-run -a python -m pytest
        tests/unit/test_gui_driving_rules.py
        tests/unit/test_gui_toolbar_buttons.py
        tests/unit/test_gui_summary_default.py
        tests/unit/test_gui_layout.py
        tests/unit/test_gui_icons.py
        tests/unit/test_gui_icon_scale.py
        tests/unit/test_gui_busy_bar.py
        tests/unit/test_gui_infractions_hidden.py
        tests/unit/test_gui_formatting.py
        tests/unit/test_gui_integrity_badge.py
        tests/unit/test_batch18_gui.py
        -q

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate synthetic mock data
      run: python tests/integration/generate_mock_ddd.py
    - name: Semantic coverage audit (no regressions vs committed baseline)
      # Fails when unparsed/semantic-debt bytes increase versus the mock
      # baseline committed at scripts/mock_semantic_baseline.json. Decoder
      # changes that leave more bytes undecoded are caught here.
      run: python scripts/semantic_coverage_audit.py --ddd-dir tests/mock_data --baseline scripts/mock_semantic_baseline.json --fail-on-regression
